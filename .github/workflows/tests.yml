name: Tests

on:
  push:
    branches: [ main, '2.x', '2.x-dev' ]
  pull_request:
    branches: [ main, '2.x', '2.x-dev' ]

env:
  YARN_ENABLE_IMMUTABLE_INSTALLS: false
  PACKAGE_FOLDER: media-ui

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable

      - name: Run linting
        run: yarn lint

  codestyle:
    env:
      # PHPStan analyses Classes/, which reference types from the optional Neos.MetaData package.
      # It requires PHP >= 8.4, so it is installed on the 8.4 matrix variant below.
      NEOS_METADATA_PACKAGE_BRANCH: 'dev-feature/extensible-metadata-properties'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4']

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Configure git safe directory
        # The checkout is owned by a different user inside the php-actions Docker container,
        # which makes git/composer refuse to operate on /app unless it is marked as safe.
        run: git config --global --add safe.directory /app

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: dependencies-composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php-versions }}
          version: 2

      - name: Install Neos.MetaData
        # Runs as root to match the php-actions Docker steps, which leave the checkout's
        # composer.json/composer.lock owned by root and therefore unwritable by the runner user.
        run: sudo composer require --no-interaction --no-progress neos/metadata:"${NEOS_METADATA_PACKAGE_BRANCH} as 2.0.0"

      - name: PHPStan
        uses: php-actions/phpstan@v3
        with:
          php_version: ${{ matrix.php-versions }}
          configuration: phpstan.ci.neon

  php-unit-tests:
    env:
      FLOW_CONTEXT: Testing
      FLOW_FOLDER: ../flow-base-distribution
      # The optional Neos.MetaData package is installed for a second functional test run.
      # It requires PHP >= 8.4, so it is only installed on the 8.4 matrix variant.
      NEOS_METADATA_PACKAGE_BRANCH: 'dev-feature/extensible-metadata-properties'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4']
        flow-versions: ['8.4']

    # The metadata capable tests (which run once Neos.MetaData is installed) require a real
    # MySQL/MariaDB backend, as the Neos.MetaData storage adapter uses MySQL-specific SQL
    # (e.g. ON DUPLICATE KEY) that SQLite cannot execute.
    services:
      mariadb:
        # see https://mariadb.com/kb/en/mariadb-server-release-dates/
        image: mariadb:10.8
        env:
          MYSQL_USER: neos
          MYSQL_PASSWORD: neos
          MYSQL_DATABASE: neos_functional_testing
          MYSQL_ROOT_PASSWORD: neos
        ports:
          - "3306:3306"
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v5

      - name: Set package branch name
        run: echo "PACKAGE_TARGET_VERSION=${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV
        working-directory: .

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, xml, json, zlib, iconv, intl, pdo_sqlite, mysql
          coverage: xdebug #optional
          ini-values: opcache.fast_shutdown=0

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: dependencies-composer-${{ hashFiles('composer.json') }}

      - name: Prepare Flow distribution
        run: |
          git clone https://github.com/neos/flow-base-distribution.git -b ${{ matrix.flow-versions }} ${FLOW_FOLDER}
          cd ${FLOW_FOLDER}
          composer require --no-update --no-interaction flowpack/entity-usage:"^1.1"
          composer require --no-update --no-interaction flowpack/entity-usage-databasestorage:"^0.1"
          composer require --no-update --dev --no-interaction phpunit/phpunit:"^11.0"

          git -C ../${{ env.PACKAGE_FOLDER }} checkout -b build
          composer config repositories.package '{ "type": "path", "url": "../${{ env.PACKAGE_FOLDER }}", "options": { "symlink": false } }'
          composer require --no-update --no-interaction flowpack/media-ui:"dev-build as dev-${PACKAGE_TARGET_VERSION}"

      - name: Composer Install
        run: |
          cd ${FLOW_FOLDER}
          composer install --no-interaction --no-progress

      - name: Run Unit tests
        run: |
          cd ${FLOW_FOLDER}
          bin/phpunit --colors -c Build/BuildEssentials/PhpUnit/UnitTests.xml Packages/Application/Flowpack.Media.Ui/Tests/Unit/

      - name: Run Functional tests
        run: |
          cd ${FLOW_FOLDER}
          # The metadata-capabilities tests require the optional Neos.MetaData package, which is
          # only installed for the 8.4 matrix variant below. They are run there instead.
          bin/phpunit --colors -c Build/BuildEssentials/PhpUnit/FunctionalTests.xml --exclude-group metadata-capabilities Packages/Application/Flowpack.Media.Ui/Tests/Functional/

      - name: Install Neos.MetaData
        run: |
          cd ${FLOW_FOLDER}
          composer require --no-interaction --no-progress neos/metadata:"${NEOS_METADATA_PACKAGE_BRANCH} as 2.0.0"
          ./flow neos.flow:cache:flush --force

      - name: Setup Flow configuration for MariaDB
        # Point the Testing context at the MariaDB service, as the metadata capable tests need a
        # MySQL/MariaDB backend (see the services block above). This mirrors the split where the
        # earlier functional run stays on SQLite and only the metadata run uses MariaDB.
        run: |
          cd ${FLOW_FOLDER}
          rm -f Configuration/Testing/Settings.yaml
          cat <<EOF >> Configuration/Testing/Settings.yaml
          Neos:
            Flow:
              persistence:
                backendOptions:
                  host: '127.0.0.1'
                  driver: pdo_mysql
                  user: 'neos'
                  password: 'neos'
                  dbname: 'neos_functional_testing'
          EOF
          ./flow neos.flow:cache:flush --force

      - name: Run Functional tests with Neos.MetaData
        run: |
          cd ${FLOW_FOLDER}
          bin/phpunit --colors -c Build/BuildEssentials/PhpUnit/FunctionalTests.xml Packages/Application/Flowpack.Media.Ui/Tests/Functional/

  js-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable

      - name: Run JS unit tests
        run: yarn test:unit

  e2e:
    env:
      DEBUG: 'testcafe:tested-app:*'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable

      - name: Build main module
        run: yarn build:module

      - name: Build plugin for Neos UI
        run: yarn build:plugin

      - name: Run TestCafe
        run: yarn testcafe --config-file .testcaferc.ci.json

      - name: Archive failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: screenshots
